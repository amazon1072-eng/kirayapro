services:
  - type: web
    name: kirayapro
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node scripts/render-start.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: WHATSAPP_PROVIDER
        value: manual
      - key: SESSION_SECRET
        generateValue: true
